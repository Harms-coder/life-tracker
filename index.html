<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Månedsbog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- shows any error (also a script that fails to load, e.g. a stale cached page after a deploy) on screen, so a
         phone screenshot tells what went wrong -->
    <script>
      addEventListener("error", (e) => { const t = e.target && e.target.src ? "Kunne ikke hente " + e.target.src : (e.message || "Fejl"); const d = document.createElement("pre"); d.style.cssText = "position:fixed;left:8px;right:8px;bottom:40px;z-index:99;margin:0;padding:10px;background:#b3261e;color:#fff;font:13px system-ui;white-space:pre-wrap;border-radius:8px"; d.textContent = t + (e.error && e.error.stack ? "\n" + e.error.stack : ""); document.body.appendChild(d); }, true);
      addEventListener("unhandledrejection", (e) => dispatchEvent(new ErrorEvent("error", { message: "Promise: " + (e.reason && e.reason.message || e.reason) })));
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
